plugins {
    id 'com.gradleup.shadow' version '9.0.0-beta12'
    id 'application'
}

def flinkVersion = '2.0.2'
def kafkaConnectorVersion = '4.0.0-2.0'

configurations.all {
    resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-java') {
        select('at.yawk.lz4:lz4-java:0')
    }
}

dependencies {
    implementation project(':flink:common')

    // Provided by the Flink cluster at runtime
    compileOnly "org.apache.flink:flink-streaming-java:${flinkVersion}"
    compileOnly "org.apache.flink:flink-clients:${flinkVersion}"
    compileOnly "org.apache.flink:flink-runtime:${flinkVersion}"

    // Bundled in the job jar (not part of base Flink distribution)
    implementation "org.apache.flink:flink-cep:${flinkVersion}"
    implementation "org.apache.flink:flink-connector-kafka:${kafkaConnectorVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.slf4j:slf4j-api:1.7.36'

    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.24.3'
    runtimeOnly 'org.apache.logging.log4j:log4j-api:2.24.3'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.24.3'

    testImplementation "org.apache.flink:flink-streaming-java:${flinkVersion}"
    testImplementation "org.apache.flink:flink-test-utils:${flinkVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

application {
    mainClass = 'com.flightanomaly.FlightAnomalyJob'
}

shadowJar {
    archiveBaseName = 'flight-anomaly-detector'
    archiveClassifier = 'all'
    mergeServiceFiles()
}
