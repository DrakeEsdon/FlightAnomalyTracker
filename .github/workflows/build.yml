name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.12-bin.zip
          unzip -q gradle-8.12-bin.zip -d /opt
          echo "/opt/gradle-8.12/bin" >> $GITHUB_PATH
      - run: gradle build
